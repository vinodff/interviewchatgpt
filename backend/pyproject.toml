[project]
name = "interviewpilot-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.119,<1", "uvicorn[standard]>=0.37,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "pgvector>=0.4,<1", "redis>=6,<8",
  "pydantic-settings>=2.11,<3", "email-validator>=2.3,<3", "python-multipart>=0.0.20,<1",
  "argon2-cffi>=25,<26", "cryptography>=50.0.2,<51", "google-genai>=1.50,<3",
  "httpx>=0.28,<1", "pypdf>=6,<7", "python-docx>=1.2,<2", "pillow>=12,<13",
  "stripe>=13,<16", "alembic>=1.17,<2", "tenacity>=9,<10"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
