<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'unsafe-inline'" />
<title>InterviewWin</title>
<style>
  :root { --paper: #fbfaf5; --paper-2: #f1f0e7; --line: #e0dfd3; --ink: #1b2f29; --muted: #5d6d64; --green: #15675b; --deep: #0f2a22; }
  @media (prefers-color-scheme: dark) { :root { --paper: #17201c; --paper-2: #202b26; --line: #2f3d37; --ink: #edf3ef; --muted: #a8b8af; --green: #57c49b; --deep: #e7f3ec; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; font: 13px/1.55 "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--ink); }
  .frame { padding: 10px 12px 14px; width: 484px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 40px -18px rgb(15 42 34 / .45), 0 2px 6px rgb(15 42 34 / .08); overflow: hidden; }
  header { display: flex; align-items: center; gap: 9px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--line); background: var(--paper-2); -webkit-app-region: drag; user-select: none; font-weight: 650; }
  header .mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: #15675b; color: #fff; }
  header .mark svg { width: 16px; height: 16px; }
  header em { font: italic 400 15px Georgia, serif; color: var(--green); }
  header .spacer { flex: 1; }
  header button { -webkit-app-region: no-drag; display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
  header button:hover { background: var(--line); color: var(--ink); }
  header button.close { background: #e5604b; color: #fff; }
  main { padding: 22px 22px 22px; text-align: center; }
  h1 { margin: 0 0 6px; font: 400 22px/1.25 Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
  p { margin: 0 auto; max-width: 340px; color: var(--muted); }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .btn { min-height: 40px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: 600 13px inherit; cursor: pointer; }
  .btn.primary { background: var(--deep); color: var(--paper); border-color: transparent; }
  small { display: block; margin-top: 14px; color: var(--muted); font-size: 11px; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="card">
    <header>
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6M8 5v14M12 8v8M16 4v16M20 10v4"/></svg></span>
      <span>Interview<em>Win</em></span>
      <span class="spacer"></span>
      <button id="minimize" aria-label="Minimize"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="close" class="close" aria-label="Close InterviewWin"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <main>
      <h1 id="title">Can’t reach InterviewWin</h1>
      <p id="message">Check your internet connection. This window reconnects by itself, or you can try now.</p>
      <div class="actions">
        <button class="btn primary" id="retry">Try again</button>
        <button class="btn" id="website">Open website</button>
      </div>
      <small id="detail"></small>
    </main>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const kind = params.get("kind") || "offline";
  const copy = {
    offline: ["Can’t reach InterviewWin", "Check your internet connection. This window reconnects by itself, or you can try now."],
    outdated: ["An update is on its way", "This desktop app needs a newer version of the InterviewWin website. It will connect automatically once it’s live."],
    crashed: ["Something went wrong", "The InterviewWin window stopped unexpectedly. Try again — your account and sessions are safe."],
    incomplete: ["InterviewWin didn’t finish loading", "Part of the page couldn’t be downloaded. Check your connection — this window retries by itself, or you can try now."],
  }[kind] || null;
  if (copy) { document.getElementById("title").textContent = copy[0]; document.getElementById("message").textContent = copy[1]; }
  const code = params.get("code");
  if (code && /^[\w-]{1,40}$/.test(code)) document.getElementById("detail").textContent = `Error ${code}`;
  const bridge = window.iwDesktop;
  document.getElementById("retry").onclick = () => bridge && bridge.retry();
  document.getElementById("close").onclick = () => bridge && bridge.close();
  document.getElementById("minimize").onclick = () => bridge && bridge.minimize();
  document.getElementById("website").onclick = () => bridge && bridge.openExternal("https://www.interviewwin.live");
  if (bridge) {
    const box = document.getElementById("frame").getBoundingClientRect();
    bridge.layout({ mode: "card", width: Math.ceil(box.width), height: Math.ceil(box.height) });
  }
</script>
</body>
</html>
