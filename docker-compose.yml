name: interviewpilot
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: interviewpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: interviewpilot
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewpilot -d interviewpilot"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [internal]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [internal]
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://interviewpilot:${POSTGRES_PASSWORD}@db:5432/interviewpilot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://interviewpilot:${POSTGRES_PASSWORD}@db:5432/interviewpilot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://backend:8000/api/health')"]
      interval: 15s
      retries: 5
    restart: unless-stopped
    networks: [internal, egress]
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://interviewpilot:${POSTGRES_PASSWORD}@db:5432/interviewpilot
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["python", "-m", "app.services.worker"]
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [internal, egress]
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    networks: [internal]
  caddy:
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [frontend, backend]
    restart: unless-stopped
    networks: [internal, egress]
networks:
  internal: {internal: true}
  egress: {}
volumes:
  postgres: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
